    // document's manifest; frame srcs carry an about:blank#<uuid> marker

    // its OWN frames — from local text at the root, or text obtained from

    // navigation stays same-origin with its initiator and a deduped page

    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only

    // an origin exists), and both directions are origin-gated (on https

    // opaque contexts — file:// — everything serializes as 'null', where

    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document

      : '*';

      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.

    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;

      el.src = u + frag;

      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];

      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.

        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'

        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document

        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    // consumers read these Blobs directly. Survives the swap like the error sink.

    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.

      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).

    document.documentElement.replaceWith(doc.documentElement);

    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

0–35 phút.\",\"Đi Ginza: từ ga Oshiage đi Toei Asakusa Line thẳng tới Higashi-ginza hoặc Ginza, khoảng 15 phút, không cần đổi tàu.\"],\n places:[{name:\"Tokyo Solamachi main entrance\",note:\"Cửa vào ở ga Oshiage “SKYTREE”.\",\n   links:[{k:\"Google Maps\",u:\"https://maps.app.goo.gl/F7ddtymjgW7u4P4x6\"},{k:\"Instagram\",u:\"https://www.instagram.com/reel/DUwdKVZEzbM/?utm_source=ig_web_button_share_sheet\"}]}]},\n\n{city:\"KAMAKURA / ENOSHIMA\",num:\"Ngày 11\",date:\"26/9\",dow:\"Thứ Bảy\",title:\"Kamakura và Enoshima\",\n intro:\"Một ngày ra biển. Lịch khít nên cứ theo mốc giờ, mỗi chỗ đều có link Maps.\",\n items:[\n  {t:\"09:00 – 10:30\",a:\"Tokyo → Kamakura\",links:[{k:\"Ga Kamakura\",u:\"https://maps.app.goo.gl/fKs5utTjb4QmZ7wm9\"}]},\n  {t:\"10:30 – 11:30\",a:\"Tsurugaoka Hachiman-gu\",links:[{k:\"Google Maps\",u:\"https://maps.app.goo.gl/Y4Nj78YdGCSakLib9\"}]},\n  {t:\"11:30 – 12:30\",a:\"Ăn trưa quanh Komachi Street\",links:[{k:\"Google Maps\",u:\"https://maps.app.goo.gl/pS9uiFDpQrXr6Vqt5\"}]},\n  {t:\"12:45 – 13:30\",a:\"Đại Phật Kamakura, chùa Kotoku-in\",links:[{k:\"Google Maps\",u:\"https://maps.app.goo.gl/7GUru9m64QCb6cNw9\"}]},\n  {t:\"13:40 – 14:20\",a:\"Hase-dera\",links:[{k:\"Google Maps\",u:\"https://maps.app.goo.gl/T4QaZ2twUyNbyvij6\"}]},\n  {t:\"14:25 – 14:50\",a:\"Goryo Shrine (御霊神社)\",links:[{k:\"Google Maps\",u:\"https://maps.app.goo.gl/uXTcFHXToDiWuPT68\"}]},\n  {t:\"14:50 – 15:20\",a:\"Ga Gokurakuji (極楽寺駅)\",links:[{k:\"Google Maps\",u:\"https://maps.app.goo.gl/SyjTJcgEMentByyy9\"}]},\n  {t:\"15:30 – 16:00\",a:\"Ga Kamakurakōkō-Mae, crossing trong Slam Dunk\",links:[{k:\"Google Maps\",u:\"https://maps.app.goo.gl/hWQqjqsoT5rz5URR9\"}]},\n  {t:\"16:15 – 17:30\",a:\"Enoshima Shrine Hetsumiya và phố Nakamise Dori\",links:[{k:\"Google Maps\",u:\"https://maps.app.goo.gl/eBWLbfSo24x6ncVs6\"}]},\n  {t:\"17:30 – 18:15\",a:\"Enoshima Sea Candle\",links:[{k:\"Google Maps\",u:\"https://maps.app.goo.gl/rT8YXYEAeiHovJSM9\"}]},\n  {t:\"18:15 – 18:45\",a:\"Shonan Port Lighthouse ngắm hoàng hôn\",links:[{k:\"Google Maps\",u:\"https://maps.app.goo.gl/6T1efteJoawg18ND6\"}]},\n  {t:\"19:00 – 20:00\",a:\"Ăn tối ở Enoshima Osakana Center, hải sản và kaisendon\",links:[{k:\"Google Maps\",u:\"https://maps.app.goo.gl/iZd3xroxU5KvMU77A\"}]},\n  {t:\"20:00 – 21:30\",a:\"Enoshima → Tokyo\"}],\n tips:[\"Lịch khít nên cứ theo mốc giờ. Nếu trễ thì bỏ bớt một trong các điểm buổi chiều.\"],\n move:[\"Tokyo → Kamakura bằng JR, sau đó đi tàu Enoden dọc bờ biển.\"]},\n\n{city:\"TOKYO / YOKOHAMA\",num:\"Ngày 12\",date:\"27/9\",dow:\"Chủ Nhật\",title:\"teamLab, Odaiba và Yokohama\",\n intro:\"Sáng lội nước trong teamLab, tối ngồi bến Yokohama ngắm đèn.\",\n items:[\n  {t:\"09:30 – 11:30\",a:\"teamLab Planets\",note:\"Suất vào cửa 9:30 – 10:00. Đi chân trần và lội qua các phòng ngập nước, tham quan trung bình khoảng 2 tiếng.\",links:[{k:\"teamLab Planets\",u:\"https://www.google.com/maps/search/?api=1&query=teamLab%20Planets%20TOKYO%20DMM%20Toyosu\"}]},\n  {t:\"11:30 – 14:00\",a:\"Odaiba và ăn trưa\",note:\"Tượng Nữ thần Tự do, cầu Rainbow, và tượng Unicorn Gundam ở DiverCity. Ăn trưa ở food court.\",links:[{k:\"DiverCity Tokyo Plaza\",u:\"https://www.google.com/maps/search/?api=1&query=DiverCity%20Tokyo%20Plaza%20Odaiba\"}]},\n  {t:\"14:00 – 15:00\",a:\"Sang Yokohama\"},\n  {t:\"15:00 – 17:30\",a:\"Minato Mirai 21 và Red Brick Warehouse bên bờ biển\",links:[{k:\"Red Brick Warehouse\",u:\"https://www.google.com/maps/search/?api=1&query=Yokohama%20Red%20Brick%20Warehouse\"}]},\n  {t:\"17:30 – 19:00\",a:\"Phố Tàu Yokohama\",links:[{k:\"Yokohama Chinatown\",u:\"https://www.google.com/maps/search/?api=1&query=Yokohama%20Chinatown\"}]},\n  {t:\"19:00 – 20:30\",a:\"Về khu cảng ngắm vòng quay Cosmo Clock 21 lên đèn, rồi bắt tàu về Tokyo\",links:[{k:\"Cosmo Clock 21\",u:\"https://www.google.com/maps/search/?api=1&query=Cosmo%20Clock%2021%20Yokohama\"}]}],\n tips:[\"Đã đặt vé teamLab, suất vào cửa 9:30 – 10:00. Có mặt sớm khoảng 15 phút để gửi đồ và cởi giày.\",\"Mặc quần có thể kéo cao quá đầu gối vì có phân khu lội nước; tránh váy ngắn hoặc váy xoè vì nhiều phòng sàn gương.\",\"Đến DiverCity sớm để chụp tượng Unicorn Gundam.\",\"Còn thời gian thì ghé Odaiba Marine Park, hoặc trung tâm Decks và Aqua City.\"],\n move:[\"Sang Odaiba: từ ga Shin-Toyosu ngay trước cửa teamLab, đi tuyến Yurikamome tới ga Daiba hoặc Tokyo Teleport, khoảng 15 phút.\",\"Đi Yokohama: từ ga Tokyo Teleport đi Rinkai Line hướng Osaki, tàu nối thẳng vào JR Saikyo/Shonan-Shinjuku Line tới ga Yokohama hoặc Minato-Mirai, khoảng 45 phút, không phải đổi tàu.\"],\n places:[{name:\"Prince Shiba Park\",note:\"Một góc khác để ngắm hoàng hôn sau Tokyo Tower.\",\n   links:[{k:\"Google Maps\",u:\"https://maps.app.goo.gl/3CpDRioDwhyEVxui6\"},{k:\"Instagram\",u:\"https://www.instagram.com/reel/DXjKnpIEZXw/?utm_source=ig_web_button_share_sheet\"}]}]},\n\n{city:\"TOKYO\",num:\"Ngày 13\",date:\"28/9\",dow:\"Thứ Hai\",title:\"Ngày dự phòng\",\n intro:\"Ngày để trống. Muốn quay lại chỗ nào thì đi, không thì ở nhà nghỉ cũng được.\",\n items:[\n  {t:\"Cả ngày\",a:\"Quay lại điểm còn thiếu hoặc dời lịch do thời tiết\"},\n  {t:\"Gợi ý\",a:\"Shimokitazawa, Nakameguro hoặc Daikanyama\",links:[{k:\"Shimokitazawa\",u:\"https://www.google.com/maps/search/?api=1&query=Shimokitazawa%20Tokyo\"}]}],\n tips:[\"Giữ ngày này tương đối trống để xử lý thay đổi, mua nốt đồ hoặc chỉ đơn giản là nghỉ.\"],\n places:[{name:\"Công viên Symbol Promenade\",\n   note:\"Lưu ý: cẩm tú cầu ở khu Hydrangea Stairs chỉ nở từ cuối tháng 5 đến giữa tháng 6, cuối tháng 9 đi sẽ không còn hoa. Giờ tới thì đây là công viên ven biển Odaiba để đi dạo, tiện ghé khi đã ở sẵn khu này. Để dành cho lần sau vào đúng mùa.\",\n   addr:[\"1 Chome-3 Aomi, Koto City, Tokyo\",\"Hydrangea Stairs, 紫陽花の小路\"],\n   links:[{k:\"Google Maps\",u:\"https://maps.app.goo.gl/nz85wAYoAvo8Fb3r8\"},{k:\"Facebook\",u:\"https://www.facebook.com/share/p/1H9BnzUW9L/\"}]}]},\n\n{city:\"TOKYO\",num:\"Ngày 14\",date:\"29/9\",dow:\"Thứ Ba\",title:\"Shinjuku và mua quà\",\n intro:\"Ngày cuối ở Tokyo. Mua nốt quà, và một thứ gì đó để sau này nhìn là nhớ chuyến này.\",\n items:[\n  {t:\"10:00\",a:\"Tới Shinjuku\",links:[{k:\"Ga Shinjuku\",u:\"https://www.google.com/maps/search/?api=1&query=Shinjuku%20Station\"}]},\n  {t:\"11:00 – 14:00\",a:\"Mua sắm\"},\n  {t:\"14:30 – 17:00\",a:\"Kabukicho và Tokyo Metropolitan Government Building\",links:[{k:\"Tokyo Metropolitan Government Building\",u:\"https://www.google.com/maps/search/?api=1&query=Tokyo%20Metropolitan%20Government%20Building%20Shinjuku\"}]},\n  {t:\"17:30 – 20:00\",a:\"Ăn tối và mua quà\"},\n  {t:\"Tối\",a:\"Sắp xếp hành lý\"}],\n tips:[\"Luôn mang passport khi mua sắm để làm tax refund nếu đủ điều kiện.\"],\n move:[\"Tàu nội thành Tokyo.\"]},\n\n{city:\"TOKYO → VIỆT NAM\",num:\"Ngày 15\",date:\"30/9\",dow:\"Thứ Tư\",title:\"Về nhà\",\n intro:\"Tạm biệt Nhật Bản. Ngày bay thì không xếp gì thêm.\",\n items:[\n  {t:\"Sáng\",a:\"Ăn sáng, kiểm tra hành lý và giấy tờ\"},\n  {t:\"Trong ngày\",a:\"Ra sân bay theo giờ chuyến bay\",links:[{k:\"Sân bay Narita\",u:\"https://www.google.com/maps/search/?api=1&query=Narita%20International%20Airport%20Terminal%201\"}]},\n  {t:\"Sân bay\",a:\"Check-in, xuất cảnh, ghé Duty Free\"},\n  {t:\"Chuyến bay\",a:\"Bay về Việt Nam\"}],\n tips:[\"Xem lại giờ bay trước khi chốt phương án ra sân bay.\"],\n move:[\"Nhà ăm chã → Narita → Việt Nam.\"]}\n];\n\nconst SHOPS = [\n {name:\"Fujiya Camera\",area:\"NAKANO\",\n  note:\"Ưu tiên số 1 nếu muốn săn máy film giá tốt. Có cả khu máy cũ và junk. Cách ga Nakano khoảng 5 phút đi bộ.\",\n  links:[{k:\"Google Maps\",u:\"https://www.google.com/maps/search/?api=1&query=%E3%83%95%E3%82%B8%E3%83%A4%E3%82%AB%E3%83%A1%E3%83%A9%20%E4%B8%AD%E9%87%8E%20Fujiya%20Camera%20Nakano\"}]},\n {name:\"Map Camera\",area:\"SHINJUKU\",\n  note:\"Cửa hàng cực lớn, 6 tầng, có nhiều máy và lens cũ; đặc biệt tầng B1 có vintage Leica và medium format.\",\n  links:[{k:\"Google Maps\",u:\"https://www.google.com/maps/search/?api=1&query=Map%20Camera%20Shinjuku\"}]},\n {name:\"中古カメラBOX — Used Camera BOX\",area:\"SHINJUKU\",\n  note:\"Chỗ đáng ghé nếu muốn tìm compact film đời cũ và hàng giá mềm hơn các cửa hàng lớn.\",\n  links:[{k:\"Google Maps\",u:\"https://www.google.com/maps/search/?api=1&query=%E4%B8%AD%E5%8F%A4%E3%82%AB%E3%83%A1%E3%83%A9BOX%20%E6%96%B0%E5%AE%BF\"}]},\n {name:\"Kitamura Camera Shinjuku West\",area:\"SHINJUKU\",\n  note:\"Tầng 3 bán junk camera và lens, tầng 4 bán used camera. Hãng nói họ có lượng máy film và manual lens rất lớn.\",\n  links:[{k:\"Google Maps\",u:\"https://www.google.com/maps/search/?api=1&query=%E3%82%AB%E3%83%A1%E3%83%A9%E3%81%AE%E3%82%AD%E3%82%BF%E3%83%A0%E3%83%A9%20%E6%96%B0%E5%AE%BF%E8%A5%BF%E5%8F%A3%E5%BA%97\"}]},\n {name:\"Lemon-sha Akihabara\",area:\"AKIHABARA\",\n  note:\"Hợp nếu muốn kết hợp săn máy film với đi khu điện tử Akihabara. Cửa hàng chuyên đồ cũ, nhiều vintage camera và lens.\",\n  links:[{k:\"Google Maps\",u:\"https://www.google.com/maps/search/?api=1&query=%E3%83%AC%E3%83%A2%E3%83%B3%E7%A4%BE%20%E7%A7%8B%E8%91%89%E5%8E%9F%E5%BA%97%20Lemon-sha%20Akihabara\"}]}\n];\n\nconst LEGS = [\n  {name:\"HÀ NỘI\",range:\"15/9\"},\n  {name:\"TOKYO\",range:\"16 – 19/9\"},\n  {name:\"OSAKA · KYOTO · NARA\",range:\"20 – 23/9\"},\n  {name:\"TOKYO & LÂN CẬN\",range:\"24 – 29/9\"},\n  {name:\"VỀ VIỆT NAM\",range:\"30/9\"}\n];\n\nconst HOSTS = {\n  \"Google Maps\":[\"GM\",\"#7a5a86\"], \"TikTok\":[\"TT\",\"#3a2f44\"], \"Instagram\":[\"IG\",\"#c4566e\"],\n  \"Threads\":[\"TH\",\"#3a2f44\"], \"Facebook\":[\"FB\",\"#5a5a8e\"]\n};\n\nfunction glyph(l){\n  if(HOSTS[l.k]) return HOSTS[l.k];\n  const u = l.u || \"\";\n  if(u.indexOf(\"maps.app\") >= 0 || u.indexOf(\"google.com/maps\") >= 0) return [\"GM\",\"#7a5a86\"];\n  if(u.indexOf(\"tiktok\") >= 0) return [\"TT\",\"#3a2f44\"];\n  if(u.indexOf(\"instagram\") >= 0) return [\"IG\",\"#c4566e\"];\n  if(u.indexOf(\"threads\") >= 0) return [\"TH\",\"#3a2f44\"];\n  if(u.indexOf(\"facebook\") >= 0) return [\"FB\",\"#5a5a8e\"];\n  return [\"↗\",\"#855d70\"];\n}\n\nfunction tagFor(l){\n  const u = l.u || \"\";\n  if(u.indexOf(\"maps.app\") >= 0 || u.indexOf(\"google.com/maps\") >= 0) return {k:\"MAPS\", c:\"#6b4f8a\", f:\"rgba(122,90,134,.14)\"};\n  if(u.indexOf(\"tiktok\") >= 0) return {k:\"TIKTOK\", c:\"#3a2f44\", f:\"rgba(58,47,68,.12)\"};\n  if(u.indexOf(\"instagram\") >= 0) return {k:\"INSTAGRAM\", c:\"#a8456b\", f:\"rgba(212,105,127,.16)\"};\n  if(u.indexOf(\"threads\") >= 0) return {k:\"THREADS\", c:\"#3a2f44\", f:\"rgba(58,47,68,.12)\"};\n  if(u.indexOf(\"facebook\") >= 0) return {k:\"FACEBOOK\", c:\"#4d4d85\", f:\"rgba(90,90,142,.14)\"};\n  return {k:\"LINK\", c:\"#746674\", f:\"rgba(141,125,136,.14)\"};\n}\n\nclass Component extends DCLogic {\n  state = {screen:\"cover\", day:0, det:null, now:Date.now()};\n\n  componentDidMount(){\n    this.syncTimer();\n    // Xoay ngang máy làm clientWidth đổi, scrollLeft thì không -> pager lệch giữa 2 ngày.\n    this.onResize = ()=>{ if(this.state.screen === \"days\") this.scrollTo(this.state.day, false); };\n    window.addEventListener(\"resize\", this.onResize);\n    this.onTap = (e)=>{\n      const el = e.target.closest && e.target.closest(\"button, a\");\n      if(!el) return;\n      if(window.matchMedia && window.matchMedia(\"(prefers-reduced-motion: reduce)\").matches) return;\n      const x = e.clientX, y = e.clientY;\n      if(x == null) return;\n      const host = document.body;\n      const ring = document.createElement(\"div\");\n      ring.style.cssText = \"position:fixed;left:\" + x + \"px;top:\" + y + \"px;width:26px;height:26px;margin:0;border-radius:50%;border:1px solid rgba(196,86,110,.7);pointer-events:none;z-index:9999;animation:tapRing .6s ease-out forwards\";\n      host.appendChild(ring);\n      setTimeout(()=>ring.remove(), 650);\n      const n = 3;\n      for(let i = 0; i < n; i++){\n        const h = document.createElement(\"div\");\n        const dx = (i - (n-1)/2) * 16 + (Math.random()*8 - 4);\n        const dy = 40 + Math.random()*26;\n        const r = (Math.random()*30 - 15).toFixed(1) + \"deg\";\n        const sz = 10 + Math.round(Math.random()*6);\n        const col = i % 2 ? \"#d4697f\" : \"#e9a5b6\";\n        h.textContent = \"♥\";\n        h.style.cssText = \"position:fixed;left:\" + x + \"px;top:\" + y + \"px;font-size:\" + sz + \"px;line-height:1;color:\" + col + \";pointer-events:none;z-index:9999;--dx:\" + dx.toFixed(1) + \"px;--dy:\" + dy.toFixed(0) + \"px;--r:\" + r + \";animation:tapHeart .9s \" + (i*0.06).toFixed(2) + \"s cubic-bezier(.25,.75,.35,1) forwards\";\n        host.appendChild(h);\n        setTimeout(()=>h.remove(), 1100);\n      }\n    };\n    document.addEventListener(\"pointerdown\", this.onTap, true);\n  }\n  componentWillUnmount(){\n    this.stopTimer();\n    clearTimeout(this._unlock);\n    window.removeEventListener(\"resize\", this.onResize);\n    document.removeEventListener(\"pointerdown\", this.onTap, true);\n    document.body.style.overflow = \"\";\n  }\n\n  // Đếm ngược chỉ hiện ở trang bìa nên chỉ chạy timer khi đang ở đó,\n  // khỏi dựng lại closure của cả 16 ngày mỗi 30 giây.\n  syncTimer(){\n    if(this.state.screen === \"cover\"){\n      if(!this.timer) this.timer = setInterval(()=>this.setState({now:Date.now()}), 30000);\n    } else this.stopTimer();\n  }\n  stopTimer(){ if(this.timer){ clearInterval(this.timer); this.timer = null; } }\n\n  componentDidUpdate(){\n    this.syncTimer();\n    // Cuộn sau khi pager đã thật sự nằm trong DOM, thay cho setTimeout đoán 40ms.\n    if(this._pending != null && this.pager().current){\n      const i = this._pending; this._pending = null;\n      this.scrollTo(i, false);\n    }\n    document.body.style.overflow = this.state.det ? \"hidden\" : \"\";\n  }\n\n  pager(){ if(!this._p) this._p = React.createRef(); return this._p; }\n\n  scrollTo(i, smooth){\n    const el = this.pager().current;\n    if(!el) return;\n    // Khoá onScroll trong lúc tự cuộn: các vị trí trung gian của smooth scroll\n    // sẽ setState lung tung làm thanh tick trên header nhấp nháy qua nhiều ngày.\n    this._lock = true;\n    clearTimeout(this._unlock);\n    el.scrollTo({left: i * el.clientWidth, behavior: smooth ? \"smooth\" : \"auto\"});\n    this._unlock = setTimeout(()=>{ this._lock = false; }, smooth ? 700 : 80);\n  }\n\n  goDay(i){\n    if(this.state.screen === \"days\"){ this.setState({day:i}); this.scrollTo(i, true); }\n    else { this._pending = i; this.setState({screen:\"days\", day:i}); }\n  }\n\n  openItem(di, ii){ this.setState({det:{d:di, i:ii, kind:\"item\"}}); }\n  openPlace(di, pi){ this.setState({det:{d:di, i:pi, kind:\"place\"}}); }\n\n  linkRow(l){\n    const g = glyph(l);\n    let host = l.u;\n    try { host = new URL(l.u).hostname.replace(\"www.\",\"\"); } catch(e){}\n    return {k:l.k, u:l.u, g:g[0], bg:g[1], host:host};\n  }\n\n  countdown(){\n    // Cất cánh Nội Bài 00:30 ngày 16/9 giờ VN; hạ cánh Narita 08:00 ngày 16/9 giờ Nhật.\n    // Mốc \"gặp nhau\" là lúc hạ cánh. Ghi kèm offset nên máy để múi giờ nào cũng đúng.\n    const dep  = new Date(\"2026-09-16T00:30:00+07:00\").getTime();\n    const land = new Date(\"2026-09-16T08:00:00+09:00\").getTime();\n    const SUB = \"Narita · 08:00 ngày 16/9\";\n    const now = this.state.now;\n    if(now >= land) return {num:\"♥\", unit:\"Gặp nhau rồi\", sub:\"Đi chậm thôi và chụp nhiều ảnh vào\"};\n    if(now >= dep){\n      const mins = Math.max(0, Math.floor((land - now)/60000));\n      if(mins >= 60) return {num:String(Math.floor(mins/60)), unit:\"giờ nữa là hạ cánh\", sub:\"Đang bay · \" + SUB};\n      return {num:String(mins), unit:\"phút nữa là hạ cánh\", sub:\"Đang bay · \" + SUB};\n    }\n    const diff = land - now;\n    const d = Math.floor(diff/86400000);\n    if(d >= 1) return {num:String(d), unit:\"ngày nữa là gặp nhau\", sub:SUB};\n    const h = Math.floor(diff/3600000);\n    if(h >= 1) return {num:String(h), unit:\"giờ nữa là gặp nhau\", sub:SUB};\n    return {num:String(Math.max(0, Math.floor(diff/60000))), unit:\"phút nữa là gặp nhau\", sub:SUB};\n  }\n\n  dayBlocks(d){\n    const bl = [];\n    if(d.tips && d.tips.length) bl.push({label:\"MẸO & LƯU Ý\", lines:d.tips});\n    if(d.move && d.move.length) bl.push({label:\"DI CHUYỂN\", lines:d.move});\n    return bl;\n  }\n\n  renderVals(){\n    const st = this.state;\n    const showCd = this.props.showCountdown ?? true;\n    const showNotes = this.props.showDayNotes ?? true;\n    const showPlaces = this.props.showPlaces ?? true;\n    const cd = this.countdown();\n\n    const days = D.map((d, di)=>{\n      const blocks = this.dayBlocks(d);\n      return {\n        city:d.city, num:d.num, date:d.date, dow:d.dow, title:d.title, intro:d.intro || \"\",\n        jump:()=>this.goDay(di),\n        tickColor: di === st.day ? \"#c4566e\" : \"rgba(164,121,140,.24)\",\n        items: d.items.map((it, ii)=>{\n          const lk = it.links || [];\n          return {\n            t:it.t, a:it.a, note:it.note || \"\", hasNote: !!it.note,\n            tags: (it.tickets ? [{k:\"VÉ QR\", c:\"#a8456b\", f:\"rgba(212,105,127,.18)\"}] : []).concat(lk.map(l=>tagFor(l))), hasTags: lk.length > 0 || !!it.tickets,\n            dot: lk.length ? \"#c4566e\" : \"#855d70\",\n            anim: \"fadeUp .5s \" + (0.06 + ii*0.045).toFixed(2) + \"s ease both\",\n            ring: lk.length ? \"ring 2.8s \" + (ii*0.3).toFixed(2) + \"s ease-out infinite\" : \"none\",\n            open:()=>this.openItem(di, ii)\n          };\n        }),\n        places: showPlaces ? (d.places || []).map((p, pi)=>({\n          name:p.name, meta:(p.links||[]).map(l=>l.k).join(\" · \"),\n          open:()=>this.openPlace(di, pi)\n        })) : [],\n        hasPlaces: showPlaces && !!(d.places && d.places.length),\n        blocks: blocks, showNotes: showNotes && blocks.length > 0\n      };\n    });\n\n    const cur = D[st.day] || D[0];\n    const vals = {\n      isCover: st.screen === \"cover\", isDays: st.screen === \"days\",\n      isShops: st.screen === \"shops\", isDetail: !!st.det,\n      shops: SHOPS.map((s, si)=>({n:String(si+1), name:s.name, area:s.area, note:s.note,\n        anim:\"fadeUp .5s \" + (0.06 + si*0.06).toFixed(2) + \"s ease both\",\n        open:()=>this.setState({det:{i:si, kind:\"shop\"}})})),\n      showCountdown: showCd, cdNum:cd.num, cdUnit:cd.unit, cdSub:cd.sub,\n      legs: LEGS, days: days,\n      curNum:cur.num, curDate:cur.date, curDow:cur.dow,\n      curCounter: (st.day+1) + \" / \" + D.length,\n      pagerRef: this.pager(),\n      onScroll: (e)=>{\n        if(this._lock) return;\n        const el = e.currentTarget;\n        if(!el.clientWidth) return;\n        const i = Math.round(el.scrollLeft / el.clientWidth);\n        if(i !== this.state.day && i >= 0 && i < D.length) this.setState({day:i});\n      },\n      goDays: ()=>this.goDay(0),\n      goCover: ()=>this.setState({screen:\"cover\"}),\n      goShops: ()=>this.setState({screen:\"shops\"}),\n      prev: ()=>this.goDay(Math.max(0, this.state.day-1)),\n      next: ()=>this.goDay(Math.min(D.length-1, this.state.day+1)),\n      closeDetail: ()=>this.setState({det:null}),\n      dtCrumb:\"\", dtTime:\"\", dtTitle:\"\", dtSubs:[], dtHasSubs:false,\n      dtLinks:[], dtHasLinks:false, dtBlocks:[], dtHasBlocks:false,\n      dtSiblings:[], dtHasSiblings:false,\n      dtTickets:[], dtHasTickets:false, dtSiblingsLabel:\"CÙNG NGÀY\"\n    };\n\n    if(st.det && st.det.kind === \"shop\"){\n      const s = SHOPS[st.det.i];\n      vals.dtCrumb = \"TUỲ CHỌN · SĂN MÁY ẢNH FILM\";\n      vals.dtTime = \"TIỆM MÁY CŨ · \" + s.area;\n      vals.dtTitle = s.name;\n      vals.dtSubs = [s.note];\n      vals.dtHasSubs = true;\n      vals.dtLinks = s.links.map(l=>this.linkRow(l));\n      vals.dtHasLinks = true;\n      vals.dtBlocks = [{label:\"GHI CHÚ\", lines:[\"Mục tuỳ chọn, chưa gắn vào ngày cụ thể.\"]}];\n      vals.dtHasBlocks = true;\n      vals.dtSiblings = SHOPS.map((o, oi)=>({t:o.area, a:o.name, idx:oi,\n        open:()=>this.setState({det:{i:oi, kind:\"shop\"}})})).filter(o=>o.idx !== st.det.i);\n      vals.dtHasSiblings = true;\n      vals.dtSiblingsLabel = \"CÁC TIỆM CÒN LẠI\";\n      return vals;\n    }\n\n    if(st.det){\n      const d = D[st.det.d];\n      vals.dtCrumb = d.num.toUpperCase() + \" · \" + d.date + \" · \" + d.city;\n      if(st.det.kind === \"item\"){\n        const it = d.items[st.det.i];\n        vals.dtTime = it.t;\n        vals.dtTitle = it.a;\n        vals.dtSubs = it.notes || (it.note ? [it.note] : []);\n        vals.dtHasSubs = vals.dtSubs.length > 0;\n        vals.dtLinks = (it.links || []).map(l=>this.linkRow(l));\n        vals.dtHasLinks = vals.dtLinks.length > 0;\n        vals.dtTickets = it.tickets || [];\n        vals.dtHasTickets = vals.dtTickets.length > 0;\n        const bl = [{label:\"TRONG NGÀY\", lines:[d.title]}].concat(this.dayBlocks(d));\n        vals.dtBlocks = bl; vals.dtHasBlocks = true;\n        vals.dtSiblings = d.items\n          .map((o, oi)=>({t:o.t, a:o.a, idx:oi, open:()=>this.openItem(st.det.d, oi)}))\n          .filter(o=>o.idx !== st.det.i);\n        vals.dtHasSiblings = vals.dtSiblings.length > 0;\n      } else {\n        const p = d.places[st.det.i];\n        vals.dtTime = \"ĐỊA ĐIỂM ĐÃ LƯU\";\n        vals.dtTitle = p.name;\n        vals.dtSubs = p.addr || [];\n        vals.dtHasSubs = !!(p.addr && p.addr.length);\n        vals.dtLinks = (p.links || []).map(l=>this.linkRow(l));\n        vals.dtHasLinks = vals.dtLinks.length > 0;\n        const bl = [];\n        if(p.note) bl.push({label:\"GHI CHÚ\", lines:[p.note]});\n        bl.push({label:\"THUỘC NGÀY\", lines:[d.num + \" (\" + d.date + \") · \" + d.title]});\n        vals.dtBlocks = bl; vals.dtHasBlocks = true;\n      }\n    }\n    return vals;\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
